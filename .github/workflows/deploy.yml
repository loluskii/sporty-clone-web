name: Build and Deploy

on:
  push:
    branches: [ west-bet24 ]
  pull_request:
    branches: [ west-bet24 ]

permissions:
  contents: write
  packages: write
  issues: write
  pull-requests: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository_owner }}/west-bet24

jobs:
  version:
    runs-on: [self-hosted, linux, x64]
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Generate version
        run: |
          # Generate version based on timestamp for now
          VERSION="1.0.$(date +%s)"
          echo "Generated version: $VERSION"
          echo "$VERSION" > .VERSION
          echo "File created:"
          ls -la .VERSION
          cat .VERSION

      - name: Set version output
        id: version
        run: |
          VERSION=$(cat .VERSION | tr -d "[:space:]\"'" | xargs)
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Generated version: $VERSION"

      - name: Upload version artifact
        uses: actions/upload-artifact@v4
        with:
          name: version
          path: .VERSION
          retention-days: 1

  release:
    needs: [version]
    runs-on: [self-hosted, linux, x64]
    if: github.ref == 'refs/heads/west-bet24' 
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: |
          npm install
          npm install --save-dev semantic-release @semantic-release/changelog @semantic-release/commit-analyzer @semantic-release/release-notes-generator @semantic-release/github @semantic-release/exec @semantic-release/git

      - name: Create release config
        run: |
          cat > release.config.js << 'EOF'
          export default {
            branches: [
              { name: 'west-bet24' },
              
            ],
            repositoryUrl: 'https://github.com/${{ github.repository }}.git',
            tagFormat: 'v${version}',
            plugins: [
              '@semantic-release/commit-analyzer',
              '@semantic-release/release-notes-generator',
              '@semantic-release/changelog',
              ['@semantic-release/github', {
                successComment: false,
                failComment: false,
                releasedLabels: false
              }],
              '@semantic-release/git',
            ],
            preset: 'angular',
          };
          EOF

      - name: Run semantic-release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npx semantic-release

  deploy:
    needs: [version, release]
    runs-on: [self-hosted, linux, x64]
    environment: GCP CI
    if: github.ref == 'refs/heads/west-bet24' 
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Create version file from output
        run: |
          echo "${{ needs.version.outputs.version }}" > .VERSION
          echo "Version from previous job: ${{ needs.version.outputs.version }}"

      - name: Set up SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.GCP_SSH_PRIVATE_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -H ${{ secrets.GCP_SERVER_IP }} >> ~/.ssh/known_hosts

      - name: Prepare deployment files
        run: |
          NEXT_VERSION=$(cat .VERSION | tr -d "[:space:]\"'" | xargs)
          echo "Deploying version: $NEXT_VERSION"
          
          # Copy repository .env file
          cp .env .env.backup 2>/dev/null || echo "No existing .env file to backup"
          
          # No need to update docker-compose since we're building locally

      - name: Deploy to GCP server
        run: |
          # Create directory on server
          ssh -o StrictHostKeyChecking=no ${{ secrets.GCP_SERVER_USER }}@${{ secrets.GCP_SERVER_IP }} 'mkdir -p ~/west-bet24/'
          
          # Copy entire source code to server using rsync
          rsync -avz --delete \
            --exclude='.git' \
            --exclude='node_modules' \
            --exclude='dist' \
            --exclude='.github' \
            -e "ssh -o StrictHostKeyChecking=no" \
            ./ ${{ secrets.GCP_SERVER_USER }}@${{ secrets.GCP_SERVER_IP }}:~/west-bet24/
          
          # Execute deployment
          ssh -o StrictHostKeyChecking=no ${{ secrets.GCP_SERVER_USER }}@${{ secrets.GCP_SERVER_IP }} '
            echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
            chmod +x ~/west-bet24/deploy.sh
            bash ~/west-bet24/deploy.sh
          '